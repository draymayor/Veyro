# Builds apps/block-watcher into a Docker image and deploys it to GCP Cloud
# Run as an always-on SERVICE (unlike sweeper-deploy.yml/consolidator-
# deploy.yml, which deploy Cloud Run JOBS) - see apps/block-watcher/Dockerfile
# and package.json for why: it holds persistent WebSocket connections and
# poll loops, so it must never scale to zero or be CPU-throttled between
# requests.
#
# Requires the same GCP_* repo secrets as api-deploy.yml (WORKLOAD_IDENTITY_
# PROVIDER, SERVICE_ACCOUNT, PROJECT_ID, REGION, ARTIFACT_REPO), plus its own
# narrowly-scoped runtime identity:
#   GCP_BLOCK_WATCHER_RUNTIME_SERVICE_ACCOUNT - only needs read access to
#     user_crypto_addresses (via the Supabase service-role key secret below)
#     and no GCP Secret Manager access at all - block-watcher holds no
#     master seed, unlike sweeper/consolidator.
#
# Runtime config from GCP Secret Manager, each of these must already exist
# with GCP_BLOCK_WATCHER_RUNTIME_SERVICE_ACCOUNT granted
# secretmanager.secretAccessor on it:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BLOCK_WATCHER_SHARED_SECRET,
#   TRONGRID_API_KEY, BLOCK_WATCHER_ALCHEMY_API_KEY
# (BLOCK_WATCHER_SHARED_SECRET MUST equal apps/api's own
# BLOCK_WATCHER_SHARED_SECRET secret exactly - see
# apps/api/src/webhooks/block-watcher's guard. TRONGRID_API_KEY is a free
# key from https://www.trongrid.io/dashboard - required, not optional:
# unauthenticated TronGrid requests are capped at 1 req/sec, below what
# this service's own poll interval needs; see config.ts's
# tronGridApiKey doc comment. Without it, main.ts deliberately holds the
# TRC20 watcher off at startup rather than retry-looping against a 429 it
# can never clear. BLOCK_WATCHER_ALCHEMY_API_KEY is DELIBERATELY a
# different Secret Manager secret ID from apps/api's own ALCHEMY_API_KEY -
# reusing that one would point this service at apps/api's existing Alchemy
# app, which has no reason to have Bitcoin/Litecoin/Dogecoin Mainnet
# enabled and would fail with Alchemy's "network not enabled for this app"
# error (see chain-config.ts's alchemyNetwork doc comment for how that
# error was confirmed live). Create a SEPARATE Alchemy app at
# dashboard.alchemy.com with those three networks enabled, and store its
# key under this secret name; without it, main.ts holds the UTXO watchers
# off even if UTXO_DETECTION_ENABLED is "true". CONFIRMED live (2026-09-09,
# `gcloud secrets get-iam-policy BLOCK_WATCHER_ALCHEMY_API_KEY`) that
# GCP_BLOCK_WATCHER_RUNTIME_SERVICE_ACCOUNT already has
# secretmanager.secretAccessor on this secret, and that it holds a real
# enabled version - the earlier "NOT YET GRANTED" note here was stale, not
# still true. UTXO_DETECTION_ENABLED below was the only remaining gap.)
#
# --min-instances=1 --max-instances=1 --no-cpu-throttling: exactly one
# instance, always warm, with CPU available outside of request handling.
# More than one instance would open duplicate WS connections and duplicate
# poll loops against the same free-tier RPC budgets for no benefit (result
# rows are deduped downstream anyway by UNIQUE(network, tx_hash, address),
# so a second instance buys nothing but wasted quota) - min/max both pinned
# to 1 rather than just min, to actually prevent that rather than only
# guaranteeing a floor. --no-cpu-throttling keeps the event loop/poll timers
# running between Cloud Run's own health-check hits, which default Cloud Run
# CPU throttling would otherwise stall. Deployed WITHOUT --allow-
# unauthenticated: nothing external calls this service (it only ever calls
# OUT to apps/api), Cloud Run's own health/startup probes reach the
# container regardless of invoker IAM.
name: Block Watcher Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/block-watcher/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/block-watcher-deploy.yml"
  workflow_dispatch: {}

env:
  SERVICE_NAME: veyro-block-watcher

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter block-watcher lint

      - name: Test
        run: pnpm --filter block-watcher test

      - name: Build (typecheck)
        run: pnpm --filter block-watcher build

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -f apps/block-watcher/Dockerfile \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: --service-account=${{ secrets.GCP_BLOCK_WATCHER_RUNTIME_SERVICE_ACCOUNT }} --min-instances=1 --max-instances=1 --no-cpu-throttling
          # API_BASE_URL is the real deployed apps/api Cloud Run URL,
          # confirmed live via `gcloud run services describe veyro-api`
          # 2026-09-07 - re-check it if that service is ever recreated
          # (Cloud Run URLs are stable across redeploys of the same
          # service, but not across a delete+recreate).
          #
          # The EVM_RPC_URL_* values below were live-verified with a plain
          # `eth_chainId` POST on 2026-09-07 (result's chain ID checked
          # against each network's real chain ID - Celo 42220/0xa4ec, Flare
          # 14/0xe, Fantom 250/0xfa, Cronos 25/0x19, Ethereum Classic
          # 61/0x3d, Kaia 8217/0x2019, XDC 50/0x32 - all matched). Two of the
          # three URLs originally recorded during design research were
          # already dead by verification time and were swapped for working
          # ones: rpc.ftm.tools now 401s ("API key not found" - it's gated
          # despite being publicized as free) and etc.rivet.link no longer
          # resolves in DNS at all. Free public RPCs change/rotate over
          # time regardless; re-verify periodically with the same
          # eth_chainId check rather than assuming these stay up.
          env_vars: |
            API_BASE_URL=https://veyro-api-479708499599.us-central1.run.app
            ADDRESS_MAP_REFRESH_MS=60000
            UTXO_DETECTION_ENABLED=true
            EVM_RPC_URL_Celo=https://forno.celo.org
            EVM_RPC_URL_Flare=https://flare-api.flare.network/ext/C/rpc
            EVM_RPC_URL_Fantom=https://rpcapi.fantom.network
            EVM_RPC_URL_Cronos=https://evm.cronos.org
            EVM_RPC_URL_Ethereum_Classic=https://etc.drpc.org
            EVM_RPC_URL_Kaia=https://public-en.node.kaia.io
            EVM_RPC_URL_XDC_Network=https://rpc.xdcrpc.com
          secrets: |
            SUPABASE_URL=SUPABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
            BLOCK_WATCHER_SHARED_SECRET=BLOCK_WATCHER_SHARED_SECRET:latest
            TRONGRID_API_KEY=TRONGRID_API_KEY:latest
            ALCHEMY_API_KEY=BLOCK_WATCHER_ALCHEMY_API_KEY:latest
