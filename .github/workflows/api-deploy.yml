# Builds apps/api into a Docker image and deploys it to GCP Cloud Run,
# per docs/architecture.md and docs/deployment.md. Requires these repo
# secrets to be configured before this workflow can run:
#   GCP_PROJECT_ID       - GCP project hosting the Cloud Run service
#   GCP_REGION            - e.g. us-central1
#   GCP_WORKLOAD_IDENTITY_PROVIDER - full resource name of the WIF provider
#   GCP_SERVICE_ACCOUNT   - service account CI authenticates as to deploy
#   GCP_RUNTIME_SERVICE_ACCOUNT - service account the Cloud Run service
#                                 itself runs as; deliberately narrower
#                                 than GCP_SERVICE_ACCOUNT (only
#                                 secretmanager.secretAccessor on the four
#                                 secrets below, no run.admin) since this
#                                 identity is what user-facing request
#                                 handling executes as
#   GCP_ARTIFACT_REPO      - Artifact Registry repo name (e.g. "veyro")
#
# Runtime config comes from GCP Secret Manager, not plain env vars, per
# deployment.md's Secrets Management section. Each secret below must
# already exist in Secret Manager with GCP_RUNTIME_SERVICE_ACCOUNT
# granted secretmanager.secretAccessor on it:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY,
#   COINGECKO_API_KEY
name: API Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch: {}

env:
  SERVICE_NAME: veyro-api

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter api lint

      - name: Build (typecheck)
        run: pnpm --filter api build

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          service_account: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
          secrets: |
            SUPABASE_URL=SUPABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
            RESEND_API_KEY=RESEND_API_KEY:latest
            COINGECKO_API_KEY=COINGECKO_API_KEY:latest
