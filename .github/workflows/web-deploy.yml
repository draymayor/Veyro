# Per docs/deployment.md, Vercel's own Git integration handles actual
# preview/production deploys for apps/web (connect the repo in the Vercel
# dashboard — no deploy step belongs here). This workflow is a CI quality
# gate only: it lints, type-checks, and builds apps/web on every change so
# a broken build is caught before Vercel (or a reviewer) ever sees it.
name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_BASE_URL: https://placeholder.example.com
